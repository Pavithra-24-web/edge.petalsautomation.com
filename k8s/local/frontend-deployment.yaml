# LOCAL TESTING variant of ../frontend-deployment.yaml. Remember: NEXT_PUBLIC_*
# is baked in at build time, so build this image with:
#   docker build -t petaledge-web:local ^
#     --build-arg NEXT_PUBLIC_API_URL=http://localhost:8010 ^
#     --build-arg NEXT_PUBLIC_WS_URL=ws://localhost:8010 frontend
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: petaledge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: petaledge-web:local
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: petaledge
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
