# LOCAL TESTING variant of ../backend-deployment.yaml:
#  - image built straight on your machine (`docker build -t petaledge-backend:local -f backend/Dockerfile .` from the repo root)
#  - imagePullPolicy: Never — don't try to pull from any registry, use the local image
#  - no imagePullSecrets — nothing to authenticate to
#  - Service left as ClusterIP (default) — reach it with `kubectl port-forward`
#  - 1 replica instead of 2 — no need to test rolling updates locally
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: petaledge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: petaledge-backend:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: { name: app-config }
            - secretRef: { name: app-secrets }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: petaledge
spec:
  selector:
    app: backend
  ports:
    - port: 80
      targetPort: 8000
