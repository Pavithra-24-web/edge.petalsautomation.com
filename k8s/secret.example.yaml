# TEMPLATE ONLY — do not fill this in and commit it.
#
# The real "app-secrets" Secret is created/updated by the CI/CD workflow
# (.github/workflows/ci-cd.yml) directly from GitHub Actions repo secrets, so
# actual credentials never sit in a file in this repo. This template just
# documents which keys the backend/worker Deployments expect on that Secret.
#
# If you ever need to create it manually (e.g. testing outside CI), copy this,
# fill in real values, and apply it — then don't commit the filled-in copy:
#   kubectl apply -f k8s/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: petaledge
type: Opaque
stringData:
  SECRET_KEY: "generate-with: python -c \"import secrets; print(secrets.token_hex(32))\""
  JWT_SECRET: "generate-a-different-random-64-char-hex-string"
  POSTGRES_PASSWORD: "choose-a-strong-password"
  S3_ACCESS_KEY: "choose-a-strong-access-key"
  S3_SECRET_KEY: "choose-a-strong-secret-key"
  GOOGLE_CLIENT_SECRET: ""
  SMTP_USERNAME: ""
  SMTP_PASSWORD: ""
