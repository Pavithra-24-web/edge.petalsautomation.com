server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # next export with trailingSlash: true writes each route as
    # <route>/index.html — try the trailing-slash form, then the file, then
    # fall back to the exported 404 page.
    location / {
        try_files $uri $uri/ $uri.html /404/ =404;
    }

    error_page 404 /404/index.html;
}
